<header class="header">
  <div class="header-left">
    <h1 class="page-title">{{ title }}</h1>
  </div>
  <div class="header-right">
    <div class="search-box">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" placeholder="Buscar..." />
    </div>
    <button class="icon-btn" title="Notificaciones">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
      <span class="notif-dot"></span>
    </button>
    <div class="user-chip" (click)="toggleMenu()">
      <div class="avatar" [style.background]="'#c8e6c9'" [style.color]="'#1a3530'" [style.fontSize]="'12px'" style="width:32px;height:32px;">{{ initials }}</div>
      <div class="user-info">
        <span class="user-name">{{ user?.email ?? 'Invitado' }}</span>
        <span class="user-role">Administrador</span>
      </div>
      @if (menuOpen) {
        <div class="user-menu" (click)="$event.stopPropagation()">
          <button class="menu-item logout" (click)="logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="16" height="16">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
            </svg>
            Cerrar sesión
          </button>
        </div>
      }
    </div>
  </div>
</header>
